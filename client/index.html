<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>Q-TIME</title>
<style>
*{box-sizing:border-box}body{margin:0;min-width:960px;min-height:100vh;font-family:'Malgun Gothic',Arial,sans-serif;color:#182c3d;background:#193650;background-image:linear-gradient(90deg,#ffffff07 1px,transparent 1px),linear-gradient(#ffffff07 1px,transparent 1px);background-size:27px 27px}button,input{font:inherit}button{cursor:pointer;border:1px solid #829db3;border-radius:9px;background:linear-gradient(#f8fcff,#b9ccdc);color:#182c41;padding:9px 12px;font-weight:700;box-shadow:0 2px 2px #0a23385c}button:hover{filter:brightness(1.08)}button:focus-visible,input:focus-visible{outline:3px solid #39c9ff;outline-offset:2px}.orange{color:#36200a;border-color:#bd710c;background:linear-gradient(#ffd15b,#f39811)}.teal{color:white;border-color:#237c90;background:linear-gradient(#42b3ba,#157886)}.top{height:94px;padding:15px 20px;display:flex;align-items:center;gap:10px;color:#f4faff;background:linear-gradient(110deg,#173953,#315f80 60%,#204968);border-bottom:2px solid #8aafc9}.logo{margin-right:auto;white-space:nowrap;line-height:1;font-weight:1000;font-style:italic;letter-spacing:-3px;font-size:44px;color:#fff;text-shadow:3px 3px #0b1730,-2px -2px #69c9ff,4px 5px #172b4d}.logo .q{color:#ffbc36;text-shadow:3px 3px #142744,-2px -2px #fff}.logo small{display:block;text-align:right;font-size:12px;font-style:normal;letter-spacing:5px;color:#ffd35d;margin-top:4px;text-shadow:none}.profile{background:#ffffff17;border:1px solid #b6d5e155;border-radius:10px;padding:10px;white-space:nowrap}.wallet{white-space:nowrap;color:#ffdf87;font-weight:800}.top button{white-space:nowrap}.shell{padding:12px 14px 58px;max-width:1700px;margin:auto}.channel{height:119px;border:1px solid #dcecf8;border-radius:13px;background:linear-gradient(115deg,#dbe9f4e9,#a7bfd2ed);padding:12px 16px;box-shadow:inset 0 1px #fff}.eyebrow{color:#496276;font-weight:800;font-size:15px}.channel h1{font-size:28px;margin:2px 0 8px}.tabs{display:flex;gap:8px}.tabs button{min-width:160px;border-radius:12px 12px 0 0;padding:8px}.tabs button[aria-selected=true]{background:#e8f3fc;border-bottom-color:#e8f3fc}.layout{display:grid;grid-template-columns:minmax(0,2.65fr) minmax(285px,1fr);gap:12px;margin-top:5px;height:calc(100vh - 285px);min-height:370px}.panel{border:1px solid #c7e0f0;border-radius:13px;background:linear-gradient(115deg,#dcebf8f2,#a1bdd4f5);box-shadow:inset 0 1px white,0 5px 12px #061c2f38;overflow:hidden}.rooms{display:flex;flex-direction:column;padding:12px}.panelhead{display:flex;align-items:center;gap:8px;min-height:50px;border-bottom:1px solid #f9feff80;padding-bottom:8px}.panelhead h2{margin:0 auto 0 0;font-size:21px}.roomlist{flex:1;overflow:auto;display:grid;align-content:start;gap:10px;padding:14px 3px}.empty{place-self:center;text-align:center;font-size:19px;color:#1c3247}.room{padding:14px;border-radius:10px;background:#f4faff;border:1px solid #a2c5db;display:flex;justify-content:space-between;align-items:center;gap:12px}.room strong{display:block}.room span{color:#52718b;font-size:13px}.side{display:grid;grid-template-rows:205px minmax(0,1fr);gap:12px;min-height:0}.users,.chat{padding:11px;display:flex;flex-direction:column;min-height:0}.usercard{background:#f3faff;border:1px solid #c3dfec;border-radius:12px;flex:1;padding:16px;display:flex;align-items:center;gap:14px;margin-top:6px}.avatar{display:grid;place-items:center;width:76px;height:76px;border-radius:18px;background:linear-gradient(#d5edff,#8bc0dc);border:2px solid white;font-size:45px}.usercard strong{display:block}.usercard span{display:block;color:#50718a;font-size:14px;margin-top:5px}.chatlog{flex:1;overflow:auto;background:#233c50ed;border-radius:8px;padding:9px;color:#ecf5ff;font-size:14px;min-height:80px}.chatline{margin:0 0 8px;overflow-wrap:anywhere}.chatline b{color:#ffd478}.chat form{display:flex;gap:6px;margin-top:8px}.chat input{width:100%;min-width:0;border:1px solid #96b7cc;border-radius:8px;padding:8px}.chat form button{flex:none}.footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:9px 17px;color:#d7ecff;background:#132c42;border-top:1px solid #7daac1}.footer strong{color:#ffdf91}.footer .version{margin-left:auto;color:#a2bdce;font-size:13px}.update{max-width:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}.dialog{border:1px solid #9dbed1;border-radius:14px;padding:25px;background:#e8f4fc;color:#183149;box-shadow:0 20px 70px #051a30aa;max-width:420px;width:90%}.dialog::backdrop{background:#081b2db0}.dialog h2{margin:0 0 16px}.dialog label{display:block;font-weight:700}.dialog input{width:100%;padding:10px;margin-top:7px;border:1px solid #9ab9cc;border-radius:8px}.dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:19px 0 0}@media(max-width:1100px){.top{gap:5px;padding:10px}.logo{font-size:33px}.top button{padding:7px}.profile{padding:7px}.wallet{font-size:13px}}
</style></head><body>
<header class="top"><div class="logo"><span class="q">Q</span>-TIME<small>QUIZ BATTLE</small></div><div class="profile">🐾 동동 · 최고관리자</div><div class="wallet">🟡 999953600</div><button type="button" data-info="내 프로필">내 프로필</button><button type="button" data-info="설정">⚙ 설정</button><button type="button" data-info="랭킹">랭킹</button><button type="button" data-info="상점">상점</button><button type="button" data-info="관리자">관리자</button><button type="button" data-info="로그아웃">로그아웃</button></header>
<main class="shell"><section class="channel"><div class="eyebrow">CHANNEL</div><h1 id="channel-title">자유채널</h1><div class="tabs" role="tablist" aria-label="채널"><button type="button" role="tab" aria-selected="true" data-channel="자유채널">자유채널</button><button type="button" role="tab" aria-selected="false" data-channel="초보채널">초보채널</button></div></section><div class="layout"><section class="panel rooms"><div class="panelhead"><h2>방 목록</h2><button class="teal" id="quick" type="button">빠른대전</button><button class="orange" id="create" type="button">방 만들기</button></div><div class="roomlist" id="roomlist"><p class="empty">현재 생성된 일반 대전 방이 없습니다.</p></div></section><div class="side"><section class="panel users"><div class="panelhead"><h2>현재 접속자</h2><button type="button" data-info="친구">친구</button></div><div class="usercard"><div class="avatar" aria-hidden="true">🐕</div><div><strong>동동 (나)</strong><span>Lv.1 · 대기 중</span></div></div></section><section class="panel chat"><div class="panelhead"><h2>채널 전체채팅</h2></div><div class="chatlog" id="chatlog" role="log" aria-live="polite"><p class="chatline">채팅 미리보기입니다. 현재 다른 사용자와 연결되어 있지 않습니다.</p></div><form id="chatform"><input id="chatinput" maxlength="120" aria-label="채팅 내용" placeholder="메시지 입력"><button class="orange" type="submit">전송</button></form></section></div></div></main>
<footer class="footer"><span>📢 최고관리자 공지</span><strong>OPEN TALK · 어엿챗</strong><span class="version">Client v0.1.3</span><span class="update" id="status" aria-live="polite">업데이트 확인 중…</span></footer>
<dialog class="dialog" id="dialog"><form method="dialog" id="roomform"><h2>방 만들기</h2><label>방 제목<input id="roomtitle" required maxlength="40" placeholder="퀴즈 대전"></label><menu><button type="button" id="cancel">취소</button><button class="orange" type="submit">만들기</button></menu></form></dialog>
<script>
const $=id=>document.getElementById(id);const rooms={'자유채널':[],'초보채널':[]};let current='자유채널';
function renderRooms(){const list=$('roomlist');list.replaceChildren();if(!rooms[current].length){const p=document.createElement('p');p.className='empty';p.textContent='현재 생성된 일반 대전 방이 없습니다.';list.append(p);return}for(const name of rooms[current]){const row=document.createElement('div');row.className='room';const meta=document.createElement('div');const title=document.createElement('strong');title.textContent=name;const hint=document.createElement('span');hint.textContent='로컬 미리보기 · 게임 연결 준비 중';meta.append(title,hint);const enter=document.createElement('button');enter.textContent='입장';enter.onclick=()=>alert('게임 서버 연결 후 사용할 수 있습니다.');row.append(meta,enter);list.append(row)}}
document.querySelectorAll('[data-channel]').forEach(tab=>tab.addEventListener('click',()=>{current=tab.dataset.channel;$('channel-title').textContent=current;document.querySelectorAll('[data-channel]').forEach(item=>item.setAttribute('aria-selected',String(item===tab)));renderRooms()}));document.querySelectorAll('[data-info]').forEach(button=>button.addEventListener('click',()=>alert(button.dataset.info+' 기능은 게임 서버 연결 후 사용할 수 있습니다.')));$('quick').onclick=()=>alert('빠른대전은 게임 서버 연결 후 사용할 수 있습니다.');$('create').onclick=()=>{$('dialog').showModal();$('roomtitle').focus()};$('cancel').onclick=()=>$('dialog').close();$('roomform').addEventListener('submit',event=>{if(!$('roomtitle').value.trim()){event.preventDefault();return}rooms[current].push($('roomtitle').value.trim());renderRooms();$('roomtitle').value=''});$('chatform').addEventListener('submit',event=>{event.preventDefault();const input=$('chatinput');const message=input.value.trim();if(!message)return;const line=document.createElement('p');line.className='chatline';const user=document.createElement('b');user.textContent='동동: ';line.append(user,document.createTextNode(message));$('chatlog').append(line);$('chatlog').scrollTop=$('chatlog').scrollHeight;input.value=''});if(window.qtime?.onUpdateStatus)window.qtime.onUpdateStatus(message=>{$('status').textContent=message});
</script></body></html>
