<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Q-TIME</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f4f9ff; background: radial-gradient(circle at 50% 20%, #275784, #102544 65%); font-family: Arial, 'Malgun Gothic', sans-serif; }
    main { text-align: center; padding: 48px; }
    h1 { font-size: clamp(56px, 10vw, 100px); letter-spacing: .06em; margin: 0; text-shadow: 0 6px 0 #091a36; }
    .sub { letter-spacing: .5em; color: #9fddff; font-weight: bold; margin: 8px 0 48px; }
    .badge { display: inline-block; padding: 11px 24px; border: 1px solid #7fc8ef; border-radius: 30px; background: #183c60; }
    .status { margin-top: 20px; color: #c6e1f0; }
  </style>
</head>
<body>
  <main>
    <h1>Q-TIME</h1>
    <p class="sub">QUIZ BATTLE</p>
    <div class="badge">Client v0.1.1</div>
    <p class="status" id="status">개발 준비 완료</p>
  </main>
  <script>window.qtime.onUpdateStatus(message => { document.getElementById('status').textContent = message; });</script>
</body>
</html>
